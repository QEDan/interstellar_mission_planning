[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "interstellar-mission-planning"
version = "0.1.0"
description = "Tools for planning interstellar missions"
readme = "README.md"
requires-python = ">=3.9, <3.12"
dependencies = [
    "numpy>=1.20.0",
    "scipy>=1.7.0",
    "scimath>=5.0.0",
    "matplotlib>=3.4.0",
    "pandas>=1.3.0",
    "vpython>=7.6.4",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.10.0",
    "mock>=5.0.0",
    "pylint>=3.0.0",
    "flake8>=7.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
